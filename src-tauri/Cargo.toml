[package]
name = "zhuochong"
version = "0.1.0"
description = "卓宠 · 桌面宠物平台"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zhuochong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
