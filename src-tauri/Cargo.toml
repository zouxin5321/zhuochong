[package]
name = "zhuochong"
version = "0.1.0"
description = "卓宠 · 桌面宠物平台"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zhuochong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
# 全量 LTO + codegen-units=1 在 8G 内存的机器上编译 windows crate 会直接崩
# （rustc STATUS_STACK_BUFFER_OVERRUN），这里用 thin LTO + 多 codegen unit 换稳定。
codegen-units = 8
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
